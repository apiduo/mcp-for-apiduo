# mcp.apiduo.cn HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 指向本机），自动续期并 reload nginx。
#
# 只暴露 MCP 与探活；管理端**不在这里** —— 它只绑回环，要看得开 SSH 隧道：
#   ssh -L 39091:127.0.0.1:39091 root@ai-prod  →  http://127.0.0.1:39091/admin/ui
limit_req_zone $binary_remote_addr zone=mcp_apiduo:10m rate=300r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.apiduo.cn;

    ssl_certificate     /www/server/panel/vhost/cert/mcp.apiduo.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mcp.apiduo.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache   shared:MCP_APIDUO_TLS:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/mcp.apiduo.cn.log;
    error_log  /www/wwwlogs/mcp.apiduo.cn.error.log;

    # 根路径给人类看的说明；MCP 客户端只认 /mcp
    location = / {
        default_type application/json;
        return 200 '{"service":"mcp-for-apiduo","mcp":"/mcp","health":"/healthz"}';
    }

    # 探活：这是唯一不需要 Authorization 的业务端点
    location = /healthz {
        access_log off;
        include /www/server/panel/vhost/nginx/mcp-for-apiduo-proxy.inc;
    }

    # MCP Streamable HTTP。无状态，任何副本都能处理任何请求。
    # limit_req 是洪水闸门，不是鉴权：鉴权由 new-api 的 key 决定。
    location = /mcp {
        limit_req zone=mcp_apiduo burst=60 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/mcp-for-apiduo-proxy.inc;
        # 响应可能是 text/event-stream，缓冲会掐住增量
        proxy_buffering off;
    }

    # 管理端一律不对外（防误配；真正的边界是它只监听回环）
    location ^~ /admin/ {
        return 404;
    }

    location / {
        return 404;
    }
}
