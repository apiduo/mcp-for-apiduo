# mcp.apiduo.cn HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 指向本机），自动续期并 reload nginx。
#
# 只暴露 MCP 与探活；管理端**不在这里** —— 它只绑回环，要看得开 SSH 隧道：
#   ssh -L 39091:127.0.0.1:39091 root@ai-prod  →  http://127.0.0.1:39091/admin/ui
limit_req_zone $binary_remote_addr zone=mcp_apiduo:10m rate=300r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.apiduo.cn;

    ssl_certificate     /www/server/panel/vhost/cert/mcp.apiduo.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mcp.apiduo.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache   shared:MCP_APIDUO_TLS:10m;
    ssl_session_timeout 10m;

    # 半年 HSTS：这条域名只提供 HTTPS，不存在需要降级的场景。
    # 不写 preload —— 那要提交到浏览器内置列表，且几乎不可撤回。
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /www/wwwlogs/mcp.apiduo.cn.log;
    error_log  /www/wwwlogs/mcp.apiduo.cn.error.log;

    # 根路径给人类看的说明；MCP 客户端只认 /mcp
    location = / {
        default_type application/json;
        return 200 '{"service":"mcp-for-apiduo","mcp":"/mcp","health":"/healthz"}';
    }

    # 探活：这是唯一不需要 Authorization 的业务端点
    location = /healthz {
        access_log off;
        include /www/server/panel/vhost/nginx/mcp-for-apiduo-proxy.inc;
    }

    # MCP Streamable HTTP。无状态，任何副本都能处理任何请求。
    # limit_req 是洪水闸门，不是鉴权：鉴权由 new-api 的 key 决定。
    location = /mcp {
        # 🔴 公网入口必须带**可用的** key。服务本身在「没有 Authorization」时会回落到
        #    配置里的服务身份 key —— 那是给单租户内网用的，公网暴露时必须在这里拦掉。
        #
        #    判据是 ^Bearer[ 	]+\S 而不是「头非空」。旧写法只看非空，于是
        #    `Authorization: x` / `Authorization: Bearer` 都能穿过来；服务端那边
        #    再把「解析不出来」当成「没带」而回落 —— 两处各自都「差不多对」，
        #    合起来就是一个匿名即可使用服务额度的洞（2026-11-05 实测确认）。
        if ($http_authorization !~* "^Bearer[ \t]+\S") {
            add_header WWW-Authenticate 'Bearer realm="mcp"' always;
            return 401;
        }
        limit_req zone=mcp_apiduo burst=60 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/mcp-for-apiduo-proxy.inc;
        # 响应可能是 text/event-stream，缓冲会掐住增量
        proxy_buffering off;
    }

    # 管理端：同域放行（部署者裁定，2026-11-05）。
    # 这是**有意的偏离**：服务设计上管理端只在内网暴露，而这里让它公网可达。
    # 边界由服务自己守：/admin/ui 与 /admin/healthz 免鉴权（静态页与探活），
    # 其余 /admin/* 没有 Authorization 一律 401。所以「打开页面」不等于「能改配置」。
    location ^~ /admin/ {
        limit_req zone=mcp_apiduo burst=60 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/mcp-for-apiduo-admin.inc;
    }

    location / {
        return 404;
    }
}
