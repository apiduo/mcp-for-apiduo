# mcp.apiduo.cn :80 入口 —— 除 ACME 验证外一律跳 HTTPS
server {
    listen 80;
    server_name mcp.apiduo.cn;

    access_log /www/wwwlogs/mcp.apiduo.cn.log;
    error_log  /www/wwwlogs/mcp.apiduo.cn.error.log;

    # 🔴 ACME HTTP-01：必须 ^~ 且排在 location / 之前，否则被 catch-all 吃掉，
    #    首次签发与三个月后的续期都会静默失败（只会在某天突然过期）。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
