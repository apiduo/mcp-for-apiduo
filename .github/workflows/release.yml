name: Release

# push 到 main 即发版：自增 patch → 跨平台构建 → 镜像冒烟 → 推 GHCR → 打 tag → 建 Release。
# 补发：workflow_dispatch 传 tag=v0.0.1 —— 检出该 tag、不再打新 tag、只重建 Release。
#       适用于「tag 推上去了但 Release 步骤失败」这种半成品。
# 逃生阀：提交信息里带 [skip release] 的 push 整条流水线跳过（workflow_dispatch 不受影响）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '补发已存在的 tag（留空 = 按 patch 自增发新版本）'
        required: false
        default: ''

permissions:
  contents: write        # 缺这一条，打 tag / 建 Release 会 403
  packages: write        # 缺这一条，docker push ghcr.io 会 403

# 同一分支串行：两个进程同时读到同一个 tag 再各自自增会撞版本。
# 刻意不写 cancel-in-progress:true —— 发版跑一半被中断会留下「镜像/产物已出、tag 未打」的中间态。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # push 必须钉住 github.sha：github.ref 是分支指针，发版要跑几分钟，
          # 期间再有 push 就会把 tag 打到不是本次触发的提交上。
          # 补发时必须检出那个 tag，否则会拿主干代码构建并覆盖 :<version> 的承诺。
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0        # 浅克隆拿不到历史 tag，版本号会永远从 v0.0.1 起算

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Test
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # 两种模式：auto = push main，自增 patch；tag = 补发已有 tag，不自增。
          # 补发路径存在的原因：tag 推上去之后 Release 步骤仍可能失败（瞬时 5xx、额度），
          # 那时重跑若还走 auto，会算出下一个 patch，原 tag 就永远没有 Release。
          if [ -n "${INPUT_TAG}" ]; then
            MODE=tag
            TAG="$INPUT_TAG"
            git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
              || { echo "::error::tag ${TAG} 不存在"; exit 1; }
            # TAG^ 会把 annotated tag peel 到父提交，不会取到自己
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null || true)
            echo "补发模式：${TAG}（上一个版本：${PREV:-<none>}）"
          else
            MODE=auto
            # --sort=-v:refname 不能省：字典序会把 v1.9.0 判成新于 v1.10.0
            PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
            BASE="${PREV:-v0.0.0}"          # 零 tag 冷启动从 v0.0.0 起算
            CORE="${BASE#v}"
            CORE="${CORE%%[-+]*}"           # v1.2.3-rc.1 的后缀会打断算术
            IFS=. read -r MA MI PA <<< "$CORE"
            PA="${PA%%[-+]*}"
            case "$MA$MI$PA" in
              ''|*[!0-9]*) echo "::error::上一个 tag 不是 vX.Y.Z 形式：$BASE"; exit 1 ;;
            esac
            TAG="v${MA}.${MI}.$((PA + 1))"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::${TAG} 已存在（并发，或有人手打了同名 tag）"; exit 1
            fi
            echo "Previous: ${PREV:-<none>} -> Next: ${TAG}"
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
          echo "next=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        env:
          PREV: ${{ steps.ver.outputs.prev }}
          TAG: ${{ steps.ver.outputs.next }}
          MODE: ${{ steps.ver.outputs.mode }}
        run: |
          set -euo pipefail
          # auto 模式下 tag 还没打，右端点是 HEAD；tag 模式下右端点就是那个 tag。
          # 首个 release 走全量历史但要限长。
          if [ "$MODE" = tag ]; then
            RANGE="${PREV:+$PREV..}${TAG}"
          elif [ -z "$PREV" ]; then
            RANGE=HEAD
          else
            RANGE="${PREV}..HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log "$RANGE" --no-merges --pretty='- %s (%h)' --max-count=100 \
              || echo "- Initial release"
            echo
            echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/${TAG}"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Build cross-platform binaries
        env:
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%%/*}
            GOARCH=${target##*/}
            EXT=''
            [ "$GOOS" = windows ] && EXT='.exe'
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/mcpd-${GOOS}-${GOARCH}${EXT}" ./cmd/mcpd
          done
          ls -la dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # 冒烟断言「自报版本 == 发布版本」：证明 -X main.version 真的注进去了，
      # 而不是发了五个跑起来还自称 0.1.0-dev 的二进制。
      - name: Smoke test
        env:
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          printf 'base_url: http://127.0.0.1:9\napi_key: smoke\n' > "$RUNNER_TEMP/smoke.yaml"
          ./dist/mcpd-linux-amd64 -config "$RUNNER_TEMP/smoke.yaml" \
            -addr :18080 -admin-addr :18081 > "$RUNNER_TEMP/mcpd.log" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:18080/healthz; then break; fi
            sleep 0.3
          done
          if ! curl -sf -o "$RUNNER_TEMP/healthz.json" http://127.0.0.1:18080/healthz; then
            echo "::error::服务没起来"; cat "$RUNNER_TEMP/mcpd.log"; exit 1
          fi
          GOT=$(jq -r .version "$RUNNER_TEMP/healthz.json")
          [ "$GOT" = "$VERSION" ] || { echo "::error::自报版本 ${GOT} != ${VERSION}"; exit 1; }
          echo "smoke ok: ${GOT}"

      # ── 镜像是发布物的一部分：前端页面与 schema 都打进去 ──────────────
      # 顺序刻意如此：构建 → 冒烟 → 推送 → 打 tag。
      # 镜像推成功之后才打 tag，任何一步失败都不会留下「有 tag、没镜像」的半成品。
      - name: Build image (amd64, for smoke)
        run: |
          set -euo pipefail
          IMG=$(printf '%s' "$IMAGE" | tr 'A-Z' 'a-z')
          docker buildx create --use --name multi --driver docker-container
          # --load 只能落单平台；多平台镜像只能推、不能在本地 docker run
          docker buildx build --platform linux/amd64 --load \
            --build-arg TARGETARCH=amd64 \
            -t "${IMG}:smoke" .

      # 三条断言分别证明：二进制版本注进去了、管理页在镜像里、契约文件在镜像里。
      # 少任何一条，「前后端都打进镜像」就只是口头承诺。
      - name: Smoke test image
        env:
          TAG: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          IMG=$(printf '%s' "$IMAGE" | tr 'A-Z' 'a-z')
          docker run -d --name mcpd-smoke \
            -p 18090:8080 -p 18091:8081 \
            -e BASE_URL=http://127.0.0.1:9 -e API_KEY=smoke "${IMG}:smoke"
          trap 'docker rm -f mcpd-smoke >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf -o "$RUNNER_TEMP/img.json" http://127.0.0.1:18090/healthz; then break; fi
            sleep 0.3
          done
          curl -sf -o "$RUNNER_TEMP/img.json" http://127.0.0.1:18090/healthz \
            || { echo "::error::容器没起来"; docker logs mcpd-smoke; exit 1; }
          GOT=$(jq -r .version "$RUNNER_TEMP/img.json")
          [ "$GOT" = "$TAG" ] || { echo "::error::镜像自报 ${GOT} != ${TAG}"; exit 1; }

          # 管理页（免鉴权的 /admin/ui），验证 admin.html 真的在镜像里
          curl -sf -o "$RUNNER_TEMP/ui.html" http://127.0.0.1:18091/admin/ui \
            || { echo "::error::镜像里没有管理页"; docker logs mcpd-smoke; exit 1; }
          grep -qi '<!doctype html' "$RUNNER_TEMP/ui.html" \
            || { echo "::error::/admin/ui 返回的不是页面"; exit 1; }

          # 能力契约（需服务身份），验证 schema 真的在镜像里
          curl -sf -H "Authorization: Bearer smoke" -o "$RUNNER_TEMP/schema.json" \
            http://127.0.0.1:18091/admin/schema \
            || { echo "::error::镜像里没有 schema"; exit 1; }
          python3 -c "import json;json.load(open('$RUNNER_TEMP/schema.json'))" \
            || { echo "::error::schema 不是合法 JSON"; exit 1; }

          echo "image smoke ok: ${GOT}"

      - name: Push multi-arch image
        env:
          TAG: ${{ steps.ver.outputs.next }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG=$(printf '%s' "$IMAGE" | tr 'A-Z' 'a-z')
          VERSION="${TAG#v}"          # git tag 带 v，镜像 tag 不带
          SHA7=$(git rev-parse --short=7 HEAD)
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # 纯 COPY 的镜像，多架构不需要 QEMU：两个平台都只是把已编译好的二进制装进去
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMG}:${VERSION}" \
            -t "${IMG}:latest" \
            -t "${IMG}:sha-${SHA7}" \
            --push .

      - name: Create tag
        if: steps.ver.outputs.mode == 'auto'
        env:
          TAG: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          # annotated tag 需要 committer 身份，runner 上默认没有全局配置
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          # 幂等：同一个 tag 重跑不应变红（补发/改了 workflow 再跑都依赖这点）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过创建"
            exit 0
          fi
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*
